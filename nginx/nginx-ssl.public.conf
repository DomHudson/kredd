server {
    listen 80;
    server_name ${KREDD_CERTBOT_DOMAIN};
    return 301 https://${KREDD_CERTBOT_DOMAIN}$request_uri;
}

server {
    listen 443 ssl;
    server_name ${KREDD_CERTBOT_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${KREDD_CERTBOT_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${KREDD_CERTBOT_DOMAIN}/privkey.pem;

    location /api/ {
        client_max_body_size 20m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/django/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static maintenance flag
    location = /maintenance.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Maintenance page
    location = /maintenance.html {
        root /usr/share/nginx/html;
    }

    # Maintenance assets only
    location /maintenance-assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # SPA
    location / {
        if (-f /usr/share/nginx/html/maintenance.json) {
            return 302 /maintenance.html;
        }

        proxy_pass http://nginx-spa:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}